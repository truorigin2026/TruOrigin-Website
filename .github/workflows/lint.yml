name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs on every push/PR, no secrets or database required at all — this is
  # a pure static check against the source tree. Fails the job on any
  # ESLint error; warnings (a documented pre-existing baseline, see the
  # commit that introduced this gate) do not fail the build.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
