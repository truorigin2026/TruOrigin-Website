name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

# This project has no separate test/staging database — the build and the
# server these tests drive both read the same Postgres instance production
# uses. The Playwright setup (tests/e2e/fixtures.ts) keeps every test
# read-only against real data: no logins, no form submissions, and the
# public product page's analytics beacons are intercepted so test traffic
# never pollutes real view-count analytics. Required repo secret:
# DATABASE_URL. See tests/e2e/README.md for the full list and rationale.
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      PLAYWRIGHT_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build (with retry for a known transient DB connection flake)
        run: |
          for attempt in 1 2 3; do
            if npm run build; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "Build failed on attempt $attempt — this project's shared DB occasionally drops the connection during static generation; retrying..."
            sleep 5
          done
          echo "Build failed 3 times in a row."
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test traces/screenshots/videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
